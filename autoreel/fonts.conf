<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Minimal fontconfig configuration for Windows.

  This file exists because fontconfig on Windows has no system-wide
  default config.  FFmpeg's drawtext and subtitles/ass filters call
  fontconfig to locate fonts, and without ANY config they exit with:

      Fontconfig error: Cannot open config dir "(NULL)"

  FONTCONFIG_FILE in clip_maker._ffmpeg_env() points here so that
  ffmpeg can find fonts.  The path expands to the Windows Fonts
  directory via an environment-variable reference so it works
  regardless of which drive Windows is installed on.
-->
<fontconfig>
  <!-- Windows system fonts directory -->
  <dir>C:/Windows/Fonts</dir>

  <!-- Allow user font dirs if set -->
  <dir prefix="xdg">fonts</dir>

  <!-- Per-user fontconfig cache (avoids rebuilding on every run) -->
  <cachedir>~/.cache/fontconfig</cachedir>

  <!-- Only load .ttf, .otf, .ttc to keep startup fast -->
  <selectfont>
    <acceptfont>
      <pattern><patelt name="fontformat"><string>TrueType</string></patelt></pattern>
    </acceptfont>
    <acceptfont>
      <pattern><patelt name="fontformat"><string>OpenType</string></patelt></pattern>
    </acceptfont>
    <acceptfont>
      <pattern><patelt name="fontformat"><string>TTC</string></patelt></pattern>
    </acceptfont>
  </selectfont>
</fontconfig>
